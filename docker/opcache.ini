; OPcache para desarrollo con la carpeta montada desde Windows.
; validate_timestamps=0: PHP NO vuelve a revisar si los archivos cambiaron
; (ese chequeo, sobre el disco montado, tardaba varios segundos por request).
; Consecuencia: después de editar archivos PHP o Blade hay que recargar Apache:
;   docker compose exec app apache2ctl -k graceful
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600
